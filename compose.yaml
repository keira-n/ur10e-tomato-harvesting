services:
  ur10e-ros2:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UR_DRIVER_BRANCH: foxy

    image: ur10e-ros2-foxy:driver-2.0.2
    container_name: ur10e-ros2

    # Direct communication with the robot on Linux
    network_mode: host
    ipc: host
    init: true

    environment:
      ROS_DISTRO: foxy
      ROS_DOMAIN_ID: "10"
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      ROS_LOCALHOST_ONLY: "0"
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /root/.Xauthority
      QT_X11_NO_MITSHM: "1"

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.Xauthority:/root/.Xauthority:ro

    stdin_open: true
    tty: true
    restart: unless-stopped

    command:
      - bash
      - -lc
      - source /opt/ros/foxy/setup.bash && source /root/ros2_ws/install/setup.bash && sleep infinity
